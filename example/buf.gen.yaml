version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: gen
    opt:
      - paths=source_relative
      - default_api_level=API_OPAQUE
  - local: protoc-gen-go-grpc
    out: gen
    opt:
      - paths=source_relative
  - local: protoc-gen-mmap-rpc
    out: gen
    opt:
      - paths=source_relative
